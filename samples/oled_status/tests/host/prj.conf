CONFIG_ZTEST=y
CONFIG_EMUL=y
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=8192
# The rate limit is exercised by the demo; here each post should draw promptly.
CONFIG_OLED_STATUS_PERIOD_MS=10
# Every PGMHEX line must reach the console: no deferred-log drops.
CONFIG_LOG_MODE_IMMEDIATE=y
