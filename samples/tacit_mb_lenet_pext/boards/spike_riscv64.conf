# The spike build of the SAME source: the ground-truth half of the experiment.
#
# Merged after prj.conf by Zephyr's configuration_files.cmake, so these three lines are
# the entire difference between the image that runs on the FPGA and the image that runs
# on the simulator.

# Target 0, not 1: spike's sink is the file writer that emits tacit.out / tacit.log /
# tacit.debug into the CWD. It needs no address, and there is no SiFive InclusiveCache
# control node at 0x2010000 in the simulator -- the L2 flush the FPGA needs would take a
# store access fault here.
CONFIG_TACIT_MB_SINK_DMA=n

# One hart. `spike zephyr.elf` starts a single hart, so a two-CPU image would wait
# forever for a secondary that never arrives. With SMP off there is no k_thread_cpu_pin()
# and none is needed: patches/0006 gives every spike hart the four instructions, so the
# heterogeneity contract that makes pinning mandatory on the FPGA does not apply.
CONFIG_SMP=n
CONFIG_MP_MAX_NUM_CPUS=1

# CONFIG_SCHED_CPU_MASK follows CONFIG_SMP, so it is not restated here; src/main.c keys
# off both.

# The FPGA board's defconfig carries CONFIG_SPEED_OPTIMIZATIONS=y and spike's does not,
# so without this line the two legs of this experiment compile the SAME curated kernels at
# two different optimisation levels: 82 static MBP sites in one image and 42 in the other,
# and two instruction streams that cannot be compared with each other at all. The MBP
# COUNTS come out identical either way -- they are a property of the shapes and the
# algorithm, not of the inliner -- but making the two builds agree costs one line and buys
# a much stronger cross-check.
CONFIG_SPEED_OPTIMIZATIONS=y
