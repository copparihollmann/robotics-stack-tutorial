# Two harts, and the ability to pin a measurement thread to a chosen one. Same three lines
# as samples/smp_hart_proof: pinning is what makes "hart 0 alone" and "hart 1 alone"
# different measurements rather than two samples of whatever the scheduler felt like.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# Timeslicing off: the two workers are pinned one per CPU and nothing else at their
# priority is runnable, so slicing can only steal cycles from inside a timed window.
CONFIG_TIMESLICING=n

# Tickless, as a second line of defence behind irq_lock().
#
# Every timed region already runs with interrupts locked, so a 1 kHz tick cannot land
# inside one. But a periodic tick would still be arriving at 1 kHz between the regions,
# evicting lines from a 16 KiB L1 and a 64 KiB L2 in the gap between the flush and the
# measurement. Tickless means the only timer interrupt programmed is the 900 s join
# deadline, so the caches between flush and window are as the flush left them.
CONFIG_TICKLESS_KERNEL=y

# -O2. A benchmark built -Os reports the speed of a smaller loop, not of the memory.
# (The inner loops are assembly, but the Sattolo shuffle and the chunk cursor are not.)
CONFIG_SPEED_OPTIMIZATIONS=y

# No heap: the working sets are fixed physical windows high in DRAM (see main.c), not
# k_malloc'd. A 16 MiB heap would have to come out of the same DRAM and would put the
# buffer wherever the allocator felt like, which is the one thing a cache benchmark
# cannot tolerate.
CONFIG_HEAP_MEM_POOL_SIZE=0
