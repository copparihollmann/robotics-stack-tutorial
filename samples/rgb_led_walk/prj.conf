CONFIG_GPIO=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096

# gpio_port_get_raw() needs no extra symbol, but GPIO_GET_DIRECTION makes
# gpio_port_get_direction() available, which the console line about output_en uses if
# anyone adds one. Cheap, and it is the register this sample most wants to be able to see.
CONFIG_GPIO_GET_DIRECTION=y
