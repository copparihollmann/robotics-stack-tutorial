#
# samples/modelblaster_pext's configuration for everything that touches the MODEL, plus
# samples/cam_capture's for the camera and samples/oled_status's for the display.  Where two
# disagree the model's value wins, because a cycle measured here has to be comparable with
# Lab B121's.
CONFIG_MB_PEXT=y

# Two harts and CPU pinning, as samples/modelblaster_pext has them: the MBP instructions are
# on hart 0 only, so a kernel that lands on hart 1 traps.  Keeping MP_MAX_NUM_CPUS at the
# board's 2 rather than cutting it to 1 is deliberate -- B121's numbers were measured on a
# two-hart image and an image with hart 1 compiled out is a different machine.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

# NO FLOATING POINT IN HARDWARE.  Both harts are WithoutFPU.  This graph's kernels are all
# integer (that is what folding the BatchNorm bought -- Lab B121 measured the unfolded
# composite at 26x because of the soft-float in it), so nothing here should need libgcc's
# float at all, and the lab's disassembly probe reports it if anything does.
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# The camera's control port and the display are on the same i2c0.  LOG_MODE_MINIMAL so
# i2c_sifive's NACK LOG_ERR is synchronous, as samples/cam_capture has it.
CONFIG_I2C=y
# BTN0, for the optional shutter mode (SD_BUTTON=1); harmless when free-running.
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2C_LOG_LEVEL_ERR=y

# The display stack.  The SSD1306 driver is default-y from the ssd1306@3c node the board's
# DTS already carries (zephyr,deferred-init, so nothing probes the bus before main()).
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
# samples/oled_status/src/{font5x8,font10x16,font15x24}.c instead of the stock set.  B146
# NEEDS THE BIG ONES: this demo is read from across a bench and "STOP" in 5x8 is 20 pixels
# wide.  The three scaled fonts together are ~7.5 KB; the stock set is ~13.8 KB.
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
# cfb_framebuffer_init() k_malloc()s its 1,024-byte buffer.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# 300 ms, NOT oled_status's 1,000 ms default, AND THAT IS A DEVIATION WITH A REASON.
# OLED_SSD1306.md section 9.6's rule is "at most one refresh per period" to keep an 82 ms bus
# write out of anything's way.  Here the loop is inherently rate-limited -- one inference is
# ~348 ms -- so the display can never be asked faster than that, and a 1 s limit would simply
# leave a stale class on the glass for two inferences out of three, which is the failure mode
# this demo was told to avoid.  The refresh still runs at the lowest application priority and
# still takes the bus mutex.
CONFIG_OLED_STATUS_PERIOD_MS=300
