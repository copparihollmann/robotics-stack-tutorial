# The union of samples/signdet_live's and samples/kws_live's, with the differences noted.

# Two harts, and CPU masking, because this image's entire point is which hart runs what.
# CONFIG_SMP with MP_MAX_NUM_CPUS=1 would compile hart 1 out of reset.S and the keyword
# spotter would silently share hart 0 with the camera -- an image that runs, and measures
# nothing this lab claims.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_MB_PEXT=y

# A timeslice landing inside a measured window would make the duty cycle and the per-frame
# cycle counts mean something other than what they say. Both parents set this.
CONFIG_TIMESLICING=n

CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_PRINTK=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# main() here only creates, pins and brackets; both workloads have their own 16 KiB
# thread stacks (the MFCC scratch and the camera line buffers are the large users).
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# The microphone (kws_live) ...
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# ... and the camera / display / buttons (signdet_live).
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_OLED_STATUS_PERIOD_MS=300

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_I2C_LOG_LEVEL_ERR=y
