CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096

# Two harts, because the bitstream has two and the memory system this measures is shared
# with the second one.  Nothing is pinned here -- hart 1 sits in wfi -- but building
# single-core would change CONFIG_MP_MAX_NUM_CPUS and with it the reset path, which is
# not a difference this measurement should carry.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

CONFIG_TIMESLICING=n

# Tickless, for the reason samples/membench gives: every timed window already runs with
# interrupts locked on this hart, but a 1 kHz tick arriving BETWEEN the L2 flush and the
# instrument run would evict lines out of a 64 KiB L2 in the gap.
CONFIG_TICKLESS_KERNEL=y

CONFIG_SPEED_OPTIMIZATIONS=y

# No heap: the working set is a fixed physical window high in DRAM, not k_malloc'd.
CONFIG_HEAP_MEM_POOL_SIZE=0
