# The extension, on. This is what makes pext.h emit real custom-0 encodings in the body
# hart 0 runs. The body hart 1 runs calls pext.h's `_sw` entry points explicitly, which
# exist whatever this is set to -- so ONE image carries both instruction mixes and the
# only thing deciding which hart executes which is k_thread_cpu_pin().
CONFIG_MB_PEXT=y

# Two harts, and the ability to pin a worker to a chosen one. Here the pin is not merely
# what makes the measurement non-vacuous (as in samples/tacit_smp) -- it is what keeps the
# MBP body off the hart where MBP is an illegal instruction.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# NO FLOATING POINT. The SoC is WithoutFPU on both harts; an app prj.conf overrides the
# board defconfig, so this is stated rather than inherited.
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n

# Timeslicing off: the workers are pinned one per CPU and nothing else at their priority
# is runnable, so slicing can only add jitter to the barrier.
CONFIG_TIMESLICING=n

# Tickless, and load-bearing rather than hygiene -- same reason as samples/tacit_smp. The
# idle differential turns on hart 1 spending IDLE_MS inside a SINGLE `wfi`; a periodic
# 1 kHz tick would wake it 200 times and make the "before" number depend on the tick rate.
CONFIG_TICKLESS_KERNEL=y

# -O2, to match the other samples on this board. The marker and both bodies are
# noinline/noclone precisely so that this cannot delete or merge them -- and the two
# bodies must stay DISTINCT SYMBOLS, or the decoded traces would not be telling two
# different stories.
CONFIG_SPEED_OPTIMIZATIONS=y

# NOT CONFIG_STARTUP_TACIT. Each worker configures its own encoder and its own sink from
# the hart it is pinned to, and asserts enable last -- see samples/tacit_dma/src/main.c
# for why the order matters.
