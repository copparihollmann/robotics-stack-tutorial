# The extension, on. This is what makes pext.h emit real custom-0 encodings in the
# generated kernels.c (see Kconfig).
CONFIG_MB_PEXT=y

# Two harts, and the ability to put a thread on the one we name. CONFIG_SCHED_CPU_MASK
# is what k_thread_cpu_pin() needs to exist at all, and pinning is the ENTIRE
# heterogeneity mechanism here (PEXT_SPEC.md section 7.3): the MBP instructions are on
# hart 0 only, so a kernel that lands on hart 1 traps.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

# NO FLOATING POINT ANYWHERE.
#
# The SoC is WithoutFPU: riscv,isa = "rv64imaczicsr_zifencei_zihpm_xrocket" for BOTH
# harts -- no f, no d, no v. Any float in the image either traps as illegal (hard float)
# or turns into libgcc soft-float calls that would dominate whatever is being measured.
# The board defconfig already sets CONFIG_FPU=n; this repeats it because an app prj.conf
# overrides the board and modelblaster's own harness prj.conf sets CONFIG_FPU=y, so the
# value has to be stated here rather than inherited.
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_PRINTK=y

# The negative test deliberately takes an illegal-instruction trap on hart 1 and
# survives it: the app overrides k_sys_fatal_error_handler to abort just the offending
# thread. The exception path has to be able to print before that happens, which is what
# these two buy. Without the k_sys_fatal_error_handler override the __weak default
# halts the system and the test reports nothing at all.
CONFIG_EXCEPTION_DEBUG=y
CONFIG_THREAD_NAME=y

# The generated model keeps its intermediate tensors in static buffers (buffers.c) and
# the curated kernels keep their scratch in .bss, so the per-inference stack is small.
# These are sized for headroom, not need.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ISR_STACK_SIZE=4096

# Timeslicing off: exactly one worker is runnable at a time and it is pinned, so slicing
# can only add noise to the cycle counts.
CONFIG_TIMESLICING=n
