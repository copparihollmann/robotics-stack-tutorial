# Pinned dependency revisions for the IISWC tutorial.
# Every entry is reachable from a public remote; anything that is NOT upstream is carried
# as a patch in patches/ and applied by a script -- scripts/05_build_tacit_tools.sh for the
# spike and decoder patches, scripts/06_patch_zephyr.sh for the Zephyr kernel one,
# scripts/07_patch_rocketchip.sh and scripts/09_patch_rocket_pext.sh for the rocket-chip
# ones, scripts/00_bootstrap.sh for the zephyr-chipyard-sw installer one, and
# scripts/28_rocket_modelblaster_pext.sh for the ModelBlaster backend one.
#
# name                  remote                                              rev / branch

zephyr-chipyard-sw      https://github.com/ucb-bar/zephyr-chipyard-sw.git   400791302d0   (rose-2-dev)
#    ^^^ FETCHABLE.  This pin was blocker #1 and this comment used to say a fresh clone could
#    not check it out.  That stopped being true and the file went on saying it; re-verified
#    2026-09-26 (B185):
#
#      $ git ls-remote https://github.com/ucb-bar/zephyr-chipyard-sw.git refs/heads/rose-2-dev
#      400791302d0d3aabde5fec22c3dc6eba33b51544        refs/heads/rose-2-dev
#      $ git -C zephyr-chipyard-sw rev-list HEAD --not --remotes | wc -l
#      0
#
#    The gitlink IS the branch tip, so `git submodule update --init` works from a fresh clone.
#
#    History, because this pin's own VALUE was once wrong too: the line read f92248ec1b4 while
#    the gitlink said 400791302d0.  400791302d0 and bf50ca87d10 were local-only submodule-
#    pointer bumps onto two ModelBlaster commits -- 543437b and 99b9e84, the toolchain every
#    board number in this programme was produced by -- which were themselves on no remote.  All
#    four are now pushed.  The ModelBlaster pair reached the remote as the base of
#    refs/heads/ir-passes-into-pipeline, and the proof is CONTAINMENT, not a 200 from the API
#    (GitHub serves pushed-then-unreferenced objects, so /commits/<sha> proves nothing):
#
#      $ git -C zephyr-chipyard-sw/modelblaster merge-base --is-ancestor 543437b \
#            $(git ls-remote .../ModelBlaster.git refs/heads/ir-passes-into-pipeline | cut -f1)
#      $ echo $?
#      0                                              # and the same for 99b9e84
#
#    PUBLIC BUT NOT YET DURABLE: both ModelBlaster commits sit on a feature branch and neither
#    carries a tag, so deleting that branch would un-publish them.  Tagging them, or merging
#    that branch, is what makes this permanent.
