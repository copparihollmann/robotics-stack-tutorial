CONFIG_MULTITHREADING=n

# Trace from the reset vector, not from main().
#
# CONFIG_STARTUP_TACIT alone is not enough on this SoC, and that is the whole point of
# this sample. Unpatched, arch/riscv/core/reset.S writes TR_TE_CTRL = 0x2 and nothing
# else: the sink target stays at its reset value of 0, and PynqZ2RocketTacitConfig
# instantiates only tacit.WithTraceSinkDMA(1), so TraceSinkArbiter accepts every byte for
# target 0 and drops it. The encoder runs, the sink never sees a byte, and nothing
# complains. Fixing it after the fact does not work either -- TR_TE_TARGET is a live mux,
# so re-targeting a running encoder hands the sink a stream that starts mid-packet, with
# no sync packet for the decoder to lock onto.
#
# patches/0003-zephyr-startup-tacit-dma-sink.patch adds the two options below and makes
# reset.S program the sink address and the target BEFORE it asserts enable. See
# fpga/pynq-z2/docs/TACIT_ON_FPGA.md.
CONFIG_STARTUP_TACIT=y
CONFIG_STARTUP_TACIT_TARGET=1
CONFIG_STARTUP_TACIT_SINK_DMA_ADDR=0x88000000
