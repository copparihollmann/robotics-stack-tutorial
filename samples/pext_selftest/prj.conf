# Single-threaded, like samples/tacit: nothing here needs a scheduler, and a trace with
# no idle thread and no tick in it is a trace of the test and of nothing else.
CONFIG_MULTITHREADING=n

# Trace from the reset vector. The point of tracing this sample at all is to hand the
# TACIT decoder a binary that contains all four custom-0 encodings, so the trace has to
# cover the code that executes them.
CONFIG_STARTUP_TACIT=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
