CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_EXTRA_EXCEPTION_INFO=y
# RAW MMIO, NOT THE DMIC DRIVER.  The board's devicetree already has pdm-mic@10090000 at
# status="okay" and CONFIG_AUDIO_DMIC_PDM_MMIO would come up with it, but this lab asks
# about eight registers, not about an API: the driver negotiates a rate from the RATE
# register and refuses a mismatch of more than 1 permille, which is exactly the quantity
# under test here.  Bringing it up would decide the question by refusing to answer it.
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n
# One hart is enough: nothing here is dispatched to the engine, so nothing needs hart 1.
# (The board's own defconfig sets SMP=y and MP_MAX_NUM_CPUS=2; left alone.)
CONFIG_HEAP_MEM_POOL_SIZE=0
