# The extension, on. This is what makes pext.h emit real custom-0 encodings in the
# generated kernels.c -- and therefore what puts MBP instructions inside the traced
# window at all.
CONFIG_MB_PEXT=y

# The trace sink. y here is the FPGA's DMA sink; boards/spike_riscv64.conf turns it off,
# which is the whole board-vs-simulator difference. See Kconfig.
CONFIG_TACIT_MB_SINK_DMA=y

# Two harts, and the ability to put a thread on the one we name. The MBP instructions
# exist on hart 0 only (PEXT_SPEC.md section 7.3), so the traced worker is pinned there;
# CONFIG_SCHED_CPU_MASK is what k_thread_cpu_pin() needs to exist at all.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

# NOT CONFIG_STARTUP_TACIT. That fragment enables the encoder in reset.S before anything
# has set a sink target or a sink address, so on this SoC the boot trace streams into a
# target that is not instantiated and is dropped -- and worse, re-targeting a RUNNING
# encoder hands the sink a stream that begins mid-packet, because the sync packet is
# emitted on the 0->1 edge of enable. main() therefore configures the sink first and
# asserts enable last. TACIT_ON_FPGA.md sections 2 and 7.

# NO FLOATING POINT ANYWHERE.
#
# The SoC is WithoutFPU on both harts. Any float in the image either traps as illegal or
# turns into libgcc soft-float calls that would dominate the traced window. The board
# defconfig already sets CONFIG_FPU=n; this repeats it because an app prj.conf overrides
# the board, spike_riscv64_defconfig sets CONFIG_FPU=y, and this one image builds for
# both.
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_PRINTK=y

# The generated model keeps its intermediate tensors in static buffers (buffers.c) and
# the curated kernels keep their scratch in .bss, so the per-inference stack is small.
# Sized for headroom, not need.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ISR_STACK_SIZE=4096

# Timeslicing off: exactly one worker is runnable and it is pinned, so slicing can only
# put another thread's instructions inside the traced window.
CONFIG_TIMESLICING=n

# Named threads and a talkative exception path, for the same reason the other pext
# samples ask for them: if the traced worker ever lands on the wrong hart the first MBP
# encoding is an illegal instruction, and a silent halt inside a traced window is the
# least debuggable failure in this repo.
CONFIG_EXCEPTION_DEBUG=y
CONFIG_THREAD_NAME=y
