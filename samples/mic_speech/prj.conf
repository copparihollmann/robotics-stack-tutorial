CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_EXTRA_EXCEPTION_INFO=y
# RAW MMIO, NOT THE DMIC DRIVER.  dmic_pdm_mmio.c negotiates the rate from the RATE
# register with a 10-permille tolerance.  This microphone is 160 permille off that
# register (Lab B110), so the driver would REFUSE it -- correctly, since the register is
# a compile-time constant for a 34.4828 MHz build and this bitstream runs at 40 MHz.
# The devicetree node IS status="okay" for this board; it is simply not used here.
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n
# One hart.  PUSH-TO-TALK: hart 0 polls the FIFO and resamples in the 2156 core cycles
# between samples, so there is nothing for hart 1 to drain.  See main.c's header for why
# continuous capture is an RTF question and not a drain question on this image.
CONFIG_HEAP_MEM_POOL_SIZE=0

# B122: pass 1 stores the resampler's own int64 accumulator for 96,000 outputs (768 KB in
# .bss) so that the gain can be derived from the window it is applied to rather than from a
# pre-roll that ended 0.6 s earlier.  ram0 is 0x10000000 (256 MB), so this is 0.3 % of it.
