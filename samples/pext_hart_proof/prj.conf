# Two harts, and the ability to pin a thread to a chosen one. BOTH are load-bearing:
# without the second hart there is nothing to run the negative test on, and without
# pinning there is no guarantee the worker that must trap is on the hart that lacks the
# unit -- Zephyr's scheduler moves unpinned threads across both CPUs.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# Timeslicing off: the two probes are pinned one-per-CPU and run one at a time, and a
# slice landing inside the window where mtvec is displaced would be the one thing that
# could turn this test into a crash. irq_lock() already covers that window; this removes
# the question entirely.
CONFIG_TIMESLICING=n
