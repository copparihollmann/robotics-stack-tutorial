# Two harts, and the ability to pin a thread to a chosen one.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2

# k_thread_cpu_pin(). SCHED_CPU_MASK depends on SCHED_SIMPLE, which is the default
# scheduler, so nothing else has to change.
CONFIG_SCHED_CPU_MASK=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# Timeslicing off: the workers are pinned one-per-CPU and nothing else at their priority
# is runnable, so slicing can only add noise to the timing windows below.
CONFIG_TIMESLICING=n
