CONFIG_MULTITHREADING=n

# NOT CONFIG_STARTUP_TACIT. That fragment (arch/riscv/core/reset.S) writes TR_TE_CTRL=0x2
# before anything has set the sink target, so the boot trace would stream into sink
# target 0 -- which this SoC does not instantiate, so those bytes are dropped on the
# floor. Worse, switching the target with the encoder still enabled drops the DMA sink
# into the middle of a packet. main() therefore configures the sink first and asserts
# enable last; the trace then begins with the encoder's sync packet, which is what the
# decoder needs to lock on.
