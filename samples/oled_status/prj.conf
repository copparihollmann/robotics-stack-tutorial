CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048

# The display stack: i2c_sifive and ssd1306 are default-y from the devicetree nodes the
# overlay enables; CFB and the display class are not.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
# Our 5x8 font (src/font5x8.c) instead of the stock 10x16/15x24/20x32 set (~13.8 KB).
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
# cfb_framebuffer_init() k_malloc()s its 1,024-byte buffer.
CONFIG_HEAP_MEM_POOL_SIZE=2048
