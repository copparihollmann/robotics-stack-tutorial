CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=16384
# Two harts, and it matters here: the engine -- and therefore the lanes -- is a RoCC in HART 1's
# tile, so custom-1 can only be issued from hart 1.  The first version of this bench issued lst
# from main() on hart 0 and took an illegal-instruction trap at exactly the stub's address, which
# is the documented behaviour (samples/roccmoon_bench/src/main.c s1) and not a property of the
# bitstream.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_TIMESLICING=n
CONFIG_TICKLESS_KERNEL=y
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_HEAP_MEM_POOL_SIZE=0
