# Two harts, and the ability to put a thread on the one we name.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

# NO FLOATING POINT ANYWHERE.
#
# The SoC is WithoutFPU: the generated DTS says
# riscv,isa = "rv64imaczicsr_zifencei_zihpm_xrocket" for BOTH harts -- no f, no d,
# no v. Any float in the image either traps as illegal (hard float) or turns into
# libgcc soft-float calls (__muldf3, __subdf3, ...) that would dominate whatever
# is being measured. The board defconfig already sets CONFIG_FPU=n; this repeats
# it because an app prj.conf overrides the board and modelblaster's own harness
# prj.conf sets CONFIG_FPU=y, so the value must be stated here rather than
# inherited. CBPRINTF_FP_SUPPORT off keeps %f out of the console path too -- this
# app prints integers only.
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_PRINTK=y

# The generated model keeps its intermediate tensors in static buffers (buffers.c),
# so the per-inference stack is small. These are sized for headroom, not need.
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ISR_STACK_SIZE=4096

# Timeslicing off: exactly one worker is runnable at a time and it is pinned, so
# slicing can only add noise to the cycle counts.
CONFIG_TIMESLICING=n
