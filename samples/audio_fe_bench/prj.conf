# Two harts, and pinning, because the pext build MUST run on hart 0.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192

# No timeslicing: a slice landing inside a timed window is the one thing that would
# make a cycle count mean something other than what it says.
CONFIG_TIMESLICING=n

# This SoC is WithoutFPU. The float build of the front end is DELIBERATE and is compiled
# to libgcc soft-float calls -- that is the number the lab exists to produce. Saying it
# here so nobody "fixes" it later.
# CONFIG_FPU is not set
