# TRACE FROM THE RESET VECTOR, NOT FROM main().  Lab B153.
#
# Pass with -DEXTRA_CONF_FILE=samples/tacit_duo/from_reset.conf.  It is a separate fragment
# rather than part of prj.conf so that Lab B151's three-arm image (scripts/88) still builds
# byte for byte: CONFIG_STARTUP_TACIT changes reset.S, and that is a code-layout change.
#
# ---------------------------------------------------------------------------------------
# WHY EACH LINE IS WHAT IT IS
# ---------------------------------------------------------------------------------------
#
# CONFIG_STARTUP_TACIT
#     arch/riscv/core/reset.S programs the encoder before it hands control to z_prep_c, so
#     the trace covers the whole boot.  It is PER HART and needs no application help: every
#     hart runs __initialize, and the code indexes encoder 0x3000000 + (mhartid << 12) and
#     sink 0x3010000 + (mhartid << 12) with its own mhartid.  Both lanes are live from
#     reset with nothing in this sample involved.
#
# CONFIG_STARTUP_TACIT_TARGET=1
#     THE SILENT-FAILURE LINE.  The Kconfig default is 0, and TraceSinkArbiter drives ready
#     for targets that have no sink attached -- so target 0 accepts every byte at full rate
#     and discards it.  The encoder runs, the sink never sees a byte, and nothing anywhere
#     complains.  1 is this design's DMA sink, and it is not a guess:
#
#       fpga/pynq-z2/chipyard/PynqZ2Configs.scala
#         PynqZ2RocketBigLittlePextTacitMicRgbI2cBtnCamConfig   (SOC_MAGIC 0x5A5A0039)
#           -> PynqZ2RocketBigLittlePextTacitMicRgbConfig
#             -> PynqZ2RocketBigLittlePextTacitMicConfig
#               -> PynqZ2RocketBigLittlePextTacitConfig
#                 -> PynqZ2RocketBigLittleTacitConfig
#                    = new tacit.WithTraceSinkDMA(1) ++ ...
#
#     samples/tacit_boot/prj.conf reaches the same number the same way, and its trace is the
#     evidence that this path works on this silicon.  Verify it per run anyway: the sample
#     requires TR_SK_DMA_COUNT to be NON-ZERO by the time main() runs, because a nonzero
#     count is the only proof the target is right.  "The encoder is running" is not proof.
#
# CONFIG_STARTUP_TACIT_SINK_DMA_ADDR=0x81000000  with  _SHIFT=26
#     reset.S computes buf = ADDR + (mhartid << SHIFT), so the two BASES must be a power of
#     two apart; the SPANS need not be, and here they are not:
#
#       hart 0   0x8100_0000 .. 0x8500_0000    64 MiB   camera + SignDetLite
#       hart 1   0x8500_0000 .. 0x8E00_0000   144 MiB   MFCC + kws cnn_tiny
#
#     HART 1 GETS THE BIG REGION, AND THAT IS A MEASUREMENT OVERTURNING AN ASSUMPTION.
#     The first B153 layout gave hart 0 the 128 MiB on the reasoning that the camera and
#     the detector are the heavy workload.  In TRACE BYTES they are not.  Over a 70.5 s
#     eight-frame run hart 0 emitted 33,839,802 B (0.0120 B/core cycle) and hart 1 emitted
#     77,509,164 B (0.0275 B/core cycle) -- hart 1 produced 2.3x hart 0's trace from a
#     workload that does a fraction of the arithmetic.  Trace volume follows BRANCH
#     density, not FLOPs: hart 0 runs long straight-line ML kernels, while hart 1 spends
#     most of the run in short spin and scheduler loops (arch_spin_relax is its top frame),
#     and BRANCH_MODE_TARGET emits a packet per taken branch.
#
#     That run OVERRAN: hart 1 wrote 115 % of the 64 MiB it had been given and ran 10.4 MB
#     past 0x8E00_0000 into the eviction-sweep window.  Nothing was corrupted -- the sweep
#     only READS -- and the gate caught it, which is what the gate is for.  This layout is
#     that measurement applied.
#
#     Checked against THIS image rather than assumed (B153):
#
#       __kernel_ram_end = 0x8018_46B8   the top of everything the image statically owns.
#                                        bss ends 0x8017_7E30, noinit -- which is where the
#                                        interrupt stacks live -- ends 0x8018_3E38.  The
#                                        Kconfig help warns that reset.S, z_prep_c's BSS
#                                        zeroing and the interrupt stacks all run INSIDE
#                                        the traced window, so the sink must be clear of
#                                        them.  0x8100_0000 is 14.5 MiB above that top.
#       0x8E00_0000 .. 0x8E40_0000       signdet_live's evict_l2_4mib() sweep.  hart 1's
#                                        region stops exactly at its floor.
#       0x9000_0000                      top of DRAM (ram0 = <0x80000000 0x10000000>).
#
#     Nothing else in this image reserves high DRAM: `nm` finds no mbxr/roccmoon symbol, so
#     the engine runtime's 0x8800_0000..0x8E00_0000 window (which signdet_live's comment
#     mentions, and which the old 0x8800_0000 sink sat inside) is not present here.
#
#     The one thing sharing this range is the common-libc malloc arena, which
#     CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=-1 sizes as _end..top-of-RAM.  It grows UP from
#     _end, and reaching 0x8100_0000 would take a 14 MiB allocation that this image has no
#     way to make (its k_heap is CONFIG_HEAP_MEM_POOL_SIZE=2048).  The sample still checks
#     its base against _end at runtime and refuses to run if it is below it.
#
#     WHICH LANE BINDS IS THE OPPOSITE OF WHAT B153 CONCLUDED, ONCE HART 0 IS BUSY.  Lab
#     B156.  The measurement above was taken on a run in which hart 0 finished its work at
#     11.1 s of 55.0 s and idled for the rest, so its 0.0084-0.0120 B/core cycle is a BLEND
#     of work and idle and is not the signdet trace rate.  Re-measured over a window in
#     which BOTH lanes work throughout (13.309 s, scripts/90_b156_tacit_window.sh):
#
#       hart 0   23,573,153 B / 532,348,281 cyc = 0.0443 B/core cycle   1.77 MB/s
#       hart 1   15,673,261 B / 532,348,281 cyc = 0.0294 B/core cycle   1.18 MB/s
#
#     A busy hart 0 emits 5.3x what B153 measured and 1.5x what hart 1 emits -- so "hart 1
#     produces 2.3x hart 0's trace" is true of a run where hart 0 is idle for 80 % of it,
#     and false of one where both work.  THE LAYOUT BELOW IS UNCHANGED because it holds
#     comfortably at this window (hart 0 used 35 %, hart 1 10 %), but the headroom is no
#     longer where B153 put it:
#
#       hart 0    64 MiB / 0.0443 = 1.51e9 cycles =  37.9 s of busy run
#       hart 1   144 MiB / 0.0294 = 5.13e9 cycles = 128.4 s of busy run
#
#     Hart 0 is the binding lane now.  A window longer than ~35 s with both harts working
#     must move the bases (ADDR down and SHIFT up to 27 gives hart 0 128 MiB and hart 1
#     80 MiB, balancing them at ~72-76 s) -- and must re-measure rather than trust these
#     numbers, because the rate follows BRANCH density and so follows whatever the lane is
#     doing.  B153's own run is the worked example of what happens when it does not: had
#     its hart 0 kept working for all 55.0 s it would have wanted 97 MB of a 64 MiB region
#     and overrun into hart 1's lane at ~38 s, silently, because the sink has no limit
#     register.
CONFIG_STARTUP_TACIT=y
CONFIG_STARTUP_TACIT_TARGET=1
CONFIG_STARTUP_TACIT_SINK_DMA_ADDR=0x81000000
CONFIG_STARTUP_TACIT_SINK_DMA_SHIFT=26

# ---------------------------------------------------------------------------------------
# CONSOLE NOISE, AND THE DIFFERENCE BETWEEN CUTTING WORK AND HIDING IT
# ---------------------------------------------------------------------------------------
#
# In the first B153 capture the three most frequent frames in hart 0's lane were
# uart_sifive_poll_out, char_out and console_out -- 75,967 of 157,042 B-events, 48 % of the
# lane.  An attendee opening the artefact saw UART polling, not the detector.  27,188 bytes
# went to the console in a 55 s run and 11,880 of them (44 %) were THREE driver messages
# repeated 110 times each:
#
#     E: I2C address not acknowledged (NACK)
#     E: I2C failed to write message
#     E: I2C failed to transfer messages
#
# They come from i2c_sifive's LOG_ERR on the shared bus -- the SSD1306 at 0x3c and the
# HM01B0's control port at 0x24 are on one controller, and i2c_scan() plus the sensor's
# control retries NACK.  The run is healthy anyway: SD_RESULT reports shield=1, oled=1 and
# live_ok=2.
#
# TURNING THE LOG OFF DOES NOT REMOVE ANY I2C WORK.  Every transaction still happens and
# still costs what it cost; what goes away is printk'ing three lines about it 110 times.
# That is the honest cut: the per-frame budget is unchanged and the trace stops being
# mostly a recording of its own error reporting.  The 330 suppressed lines are recorded
# here and in archive/b153/RUN.md so the number is not lost.
#
# Nothing else about the console is touched -- SD_FRAME, SD_PRE, SD_INFER, SNAP and the
# eight SD_REPLAY lines the replay gate reads all still print, because those ARE the run's
# reporting and suppressing them would misrepresent what a frame costs.
CONFIG_I2C_LOG_LEVEL_OFF=y
