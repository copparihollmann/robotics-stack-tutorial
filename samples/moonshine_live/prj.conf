#
# samples/modelblaster_pext's prj.conf for everything that touches the MODEL, plus the
# microphone sample's for everything that touches the CAPTURE.  Where the two disagree the
# model's value wins and the disagreement is noted, because this image runs both.
CONFIG_MB_PEXT=y

# Two harts, and CPU pinning: the MBP instructions are on hart 0 only, so a kernel that
# lands on hart 1 traps.  Same reason as samples/modelblaster_pext.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

# NO FLOATING POINT IN HARDWARE.  The SoC is WithoutFPU for both harts.  The decoder's
# embedding write-back does use `float`, which becomes libgcc soft-float -- that is what the
# baked image does too, and it is deliberately NOT changed here: a live transcript must be
# the same arithmetic as the measured one or it is a different model.
CONFIG_FPU=n
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SPEED_OPTIMIZATIONS=y
CONFIG_EXTRA_EXCEPTION_INFO=y

# RAW MMIO FOR THE MICROPHONE, NOT THE DMIC DRIVER -- samples/mic_speech's reasoning applies
# unchanged: dmic_pdm_mmio.c negotiates the rate from the RATE register with a 10-permille
# tolerance and this microphone is 160 permille off it (Lab B110), so the driver would refuse
# it, correctly.  The devicetree node is status="okay" and is simply not used.
CONFIG_AUDIO=n
CONFIG_AUDIO_DMIC=n

# The RGB LEDs say what the board is doing to someone standing at the bench.
CONFIG_GPIO=y

CONFIG_HEAP_MEM_POOL_SIZE=0
