CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=2048

# The buttons and the lamps are the same sifive GPIO controller; CONFIG_GPIO_SIFIVE is
# default-y from the devicetree node, so only the framework symbol needs saying.  The board
# defconfig already sets it -- repeated here so the sample builds on any board that has the
# aliases, and so the dependency is visible where somebody reads the sample.
CONFIG_GPIO=y

# NOT the input subsystem.  The buttons are declared as gpio-keys in the board DTS so that
# an application CAN use input events, but this one polls: an interrupt-driven reader cannot
# distinguish a missed edge from an unpressed button, and these pins have no hardware
# debounce.  Leaving CONFIG_INPUT off also keeps the four GPIO PLIC sources unconnected,
# which is one fewer thing to be wrong about in a test whose job is to be believed.
