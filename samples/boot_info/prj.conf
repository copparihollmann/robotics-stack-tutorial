CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_SSD1306=y
CONFIG_CHARACTER_FRAMEBUFFER=y

# cfb_framebuffer_init() k_malloc()s the 1 KiB shadow buffer, so CFB needs a kernel heap or
# the link fails on an undefined k_malloc.  2048 is samples/cam_snap's value for the same
# 128x64 panel -- one definition of what this display costs.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# The bundled CFB fonts would be linked in alongside ours and are not used.
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
