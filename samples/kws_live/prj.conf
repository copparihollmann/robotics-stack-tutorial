CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# The MBP instructions exist on hart 0 only, so everything that touches them is pinned
# there. Two CPUs and CPU masking are both required for that to mean anything.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y
CONFIG_MB_PEXT=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_ISR_STACK_SIZE=2048
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

# A timeslice landing inside a measured window would make the duty-cycle number mean
# something other than what it says.
CONFIG_TIMESLICING=n
