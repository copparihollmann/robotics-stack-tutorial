#
# The display stack, enabled ONLY for an OLED build:
#   west build ... -- -DML_DEFS=ML_OLED=1 -DEXTRA_CONF_FILE=oled.conf \
#                     -DDTC_OVERLAY_FILE=<repo>/samples/oled_status/oled.overlay
#
# Kept out of prj.conf on purpose.  These pull in i2c, the display class and the character
# framebuffer, and the image that produced every measured number on 0x5A5A0035 must not carry
# drivers it has no hardware for.
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_CHARACTER_FRAMEBUFFER=y
# samples/oled_status/src/font5x8.c instead of the stock 10x16/15x24/20x32 set (~13.8 KB).
CONFIG_CHARACTER_FRAMEBUFFER_USE_DEFAULT_FONTS=n
# cfb_framebuffer_init() k_malloc()s its 1,024-byte buffer; prj.conf sets the pool to 0.
CONFIG_HEAP_MEM_POOL_SIZE=2048
