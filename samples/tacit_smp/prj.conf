# Two harts, and the ability to pin a worker to a chosen one. Same three lines as
# samples/smp_hart_proof and samples/membench: without the pin there is no guarantee the
# two workers land on two different harts and the whole measurement is vacuous.
CONFIG_SMP=y
CONFIG_MP_MAX_NUM_CPUS=2
CONFIG_SCHED_CPU_MASK=y

CONFIG_PRINTK=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048

# Timeslicing off: the workers are pinned one per CPU and nothing else at their priority
# is runnable, so slicing can only add jitter to the barrier.
CONFIG_TIMESLICING=n

# Tickless, and this one is load-bearing rather than hygiene.
#
# The whole experiment turns on hart 1 spending IDLE_MS inside a single `wfi`. With a
# periodic 1 kHz tick the idle hart is woken 200 times during a 200 ms sleep and executes
# a few hundred cycles of ISR each time, which still leaves ~99% of the interval stopped
# but makes the "before" number depend on the tick rate. Tickless arms one deadline and
# sleeps once, so the idle cost is the sleep, full stop.
CONFIG_TICKLESS_KERNEL=y

# -O2, to match the other samples on this board. The marker and the post-barrier body are
# noinline/noclone precisely so that this cannot delete them.
CONFIG_SPEED_OPTIMIZATIONS=y

# NOT CONFIG_STARTUP_TACIT. Each worker configures its own encoder and its own sink from
# the hart it is pinned to, and asserts enable last -- see samples/tacit_dma/src/main.c
# for why the order matters. The boot-trace path (samples/tacit_boot) is the other way of
# doing this and is not what this sample measures.
